name: CI Custom Apps

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-apps/custom/**
        packages/twenty-sdk/**
        packages/twenty-client-sdk/**
        packages/twenty-shared/**
        .github/workflows/ci-custom-apps.yaml
  twilio-app:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/twenty-apps/custom/twilio
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      # Custom apps build against the monorepo SDK, not a published release
      - name: Build SDK packages
        working-directory: .
        run: npx nx run-many -t build -p twenty-sdk twenty-client-sdk
      - name: Lint
        run: npx oxlint -c .oxlintrc.json .
      - name: Typecheck
        run: npx tsgo --noEmit -p tsconfig.spec.json
      - name: Unit tests
        run: npx vitest run --config vitest.unit.config.ts
  ci-custom-apps-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, twilio-app]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
